[project]
name = "coach"
version = "0.1.0.dev0"
description = "Strength coach engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
coach = "coach.cli.app:run"

[build-system]
requires = ["uv_build>=0.7.13,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-p", "pytester", "-p", "support.wall_time", "-p", "support.no_network"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
